<svg width="920" height="260" viewBox="0 0 920 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NextVibe</title>
  <desc id="desc">A colorful hero banner for NextVibe, an agent-native project navigation CLI.</desc>
  <defs>
    <linearGradient id="bg" x1="54" y1="28" x2="857" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A2F"/>
      <stop offset="0.45" stop-color="#152061"/>
      <stop offset="1" stop-color="#0E4F58"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="203" y1="98" x2="704" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="0.42" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="238" y1="170" x2="684" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="920" height="260" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="120" y="20" width="680" height="180" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.75 0 0 0 0 1 0 0 0 0.35 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

  <rect x="22" y="24" width="876" height="212" rx="36" fill="url(#bg)" filter="url(#softShadow)"/>
  <rect x="23.5" y="25.5" width="873" height="209" rx="34.5" stroke="url(#lineGradient)" stroke-opacity="0.55" stroke-width="3"/>

  <circle cx="133" cy="84" r="52" fill="#38BDF8" fill-opacity="0.16"/>
  <circle cx="789" cy="180" r="70" fill="#34D399" fill-opacity="0.12"/>
  <circle cx="728" cy="73" r="36" fill="#C084FC" fill-opacity="0.16"/>

  <path d="M128 174C171 128 214 105 257 105C304 105 327 142 374 142C423 142 449 92 503 92C555 92 586 137 631 137C670 137 704 116 735 74" stroke="url(#lineGradient)" stroke-width="7" stroke-linecap="round" stroke-opacity="0.85"/>
  <circle cx="257" cy="105" r="10" fill="#7DD3FC"/>
  <circle cx="374" cy="142" r="10" fill="#C084FC"/>
  <circle cx="503" cy="92" r="10" fill="#34D399"/>
  <circle cx="631" cy="137" r="10" fill="#7DD3FC"/>

  <g filter="url(#glow)">
    <text x="460" y="125" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="78" font-weight="900" letter-spacing="1.5" fill="url(#titleGradient)">NextVibe</text>
  </g>

  <text x="460" y="165" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#E0F2FE">Agent-native project navigation for AI coding tools</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">
    <rect x="265" y="190" width="112" height="30" rx="15" fill="#0EA5E9" fill-opacity="0.22" stroke="#38BDF8" stroke-opacity="0.6"/>
    <text x="321" y="210" text-anchor="middle" fill="#BAE6FD">scan</text>
    <rect x="394" y="190" width="132" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.2" stroke="#C084FC" stroke-opacity="0.58"/>
    <text x="460" y="210" text-anchor="middle" fill="#E9D5FF">suggest</text>
    <rect x="543" y="190" width="112" height="30" rx="15" fill="#14B8A6" fill-opacity="0.2" stroke="#2DD4BF" stroke-opacity="0.58"/>
    <text x="599" y="210" text-anchor="middle" fill="#CCFBF1">check</text>
  </g>
</svg>
