name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Verify release
        run: sh scripts/verify-release.sh

  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            package: nextvibe_linux_amd64
            format: tar.gz
          - goos: linux
            goarch: arm64
            package: nextvibe_linux_arm64
            format: tar.gz
          - goos: darwin
            goarch: amd64
            package: nextvibe_darwin_amd64
            format: tar.gz
          - goos: darwin
            goarch: arm64
            package: nextvibe_darwin_arm64
            format: tar.gz
          - goos: windows
            goarch: amd64
            package: nextvibe_windows_amd64
            format: zip
          - goos: windows
            goarch: arm64
            package: nextvibe_windows_arm64
            format: zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          binary="nextvibe"
          if [ "$GOOS" = "windows" ]; then
            binary="nextvibe.exe"
          fi
          go build -trimpath -ldflags="-s -w" -o "dist/${binary}" ./cmd/nextvibe

      - name: Package archive
        run: |
          package="${{ matrix.package }}"
          binary="nextvibe"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            binary="nextvibe.exe"
          fi

          mkdir -p "release/${package}"
          cp "dist/${binary}" "release/${package}/${binary}"
          cp README.md LICENSE "release/${package}/"

          cd release
          if [ "${{ matrix.format }}" = "zip" ]; then
            zip -r "../dist/${package}.zip" "${package}"
          else
            tar -czf "../dist/${package}.tar.gz" "${package}"
          fi

      - name: Sync archive to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/${{ matrix.package }}.${{ matrix.format }}" --clobber

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}.${{ matrix.format }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Attach checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" dist/checksums.txt --clobber
